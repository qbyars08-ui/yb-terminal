:root { --bg:#f7f9fc; --surface:#ffffff; --border:#dde4ef; --text:#22304a;

.gate .foot { color:var(--dim); font-size:11px; margin-top:22px; line-height:1.6; }
.gate .foot a { color:var(--gold); text-decoration:none; }
